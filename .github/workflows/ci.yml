name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Tests (content rules, logic, components, contrast, CSP)
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser audit (axe-core accessibility, page weight)
        run: |
          npx playwright install --with-deps chromium
          npm run preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          node scripts/audit.mjs "$RUNNER_TEMP/audit"
