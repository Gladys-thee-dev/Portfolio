    />

    <script>
      // Apply the saved or system theme before first paint, so there is no flash.
      (function () {
        var t;
        try {
          t = localStorage.getItem('theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-bs-theme', t);
      })();
    </script>
  </head>
  <body>
    <noscript>This site needs JavaScript. You can also find Gladys at https://github.com/Gladys-thee-dev.</noscript>
    <div id="root"></div>
    <!-- Registers the contact form with Netlify Forms at deploy time; the React form posts to it. -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
