# Netlify builds and deploys the site from GitHub on every push to main.
# Tests run first, so a failing change is never published.

[build]
  base = "frontend"
  command = "npm test && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: unknown paths render index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # The one inline script (theme before first paint, in index.html) is allowed by its
    # hash, so no other inline script can run; src/test/security.test.js keeps the hash
    # in sync. Inline style *attributes* are needed for the reveal delays.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-8qq0J0NxbK8c9c9Po0cTwycxVWA11S9tRQM+fHE/QXQ='; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Vite fingerprints these file names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
